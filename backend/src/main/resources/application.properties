server.port=5001

# H2 Embedded Persistent Database configuration (in-process, zero network sockets)
spring.datasource.url=jdbc:h2:file:./data/timeforge;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console to avoid socket binding
spring.h2.console.enabled=false

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# TimeForge JWT Configuration
timeforge.jwt.secret=timeforge_secret_key_that_is_at_least_256_bits_long_for_security_timeforge_2026
timeforge.jwt.expiration=604800000
